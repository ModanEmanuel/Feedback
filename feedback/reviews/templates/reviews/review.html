<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Review</title>
</head>
<body>
<!--Creating a form :-->
  <form action= "/"method="POST"><!--      How and where the form is submitted-->
      {% csrf_token %}<!--      IMPORTANT TO GENERATE THE TOKEN FOR PROTECTION ANTI-DUPLICATION !!! -->
      {% if has_error%}<!--      Validating the data-->
        <p>This form is invalid - Please enter a valid username !</p>
      {% endif %}
    <label for="username">Your Name</label>
    <input id="username" name="username" type="text">
    <button>Send</button>
  </form>
</body>
</html>
